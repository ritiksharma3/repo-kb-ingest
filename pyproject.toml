[project]
name = "repo-kb-ingest"
version = "0.1.0"
description = "Deterministic (no-LLM) repo knowledge-base ingestion pipeline - Phase 1"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12", "psycopg[binary]>=3.1", "alembic>=1.13", "sqlalchemy>=2.0",
  "tree-sitter==0.26.1", "tree-sitter-javascript==0.25.0", "sqlglot==30.31.0",
  "jinja2>=3.1", "jsonschema>=4.20", "pyyaml>=6", "mcp>=1.0",
]
[project.optional-dependencies]
dev = ["pytest>=8"]
mysql = ["pymysql>=1.1", "cryptography>=42"]
[project.scripts]
kbingest = "kbingest.cli:app"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
kbingest = ["dossier/templates/*.j2", "dossier/*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
